<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon.js App</title>
    
</head>
<body>

<canvas id="renderCanvas"></canvas>

<header id="top-bar">
    Digital Replica
</header>

<div id="info-panel" class="glass">
    <div class="panel-header">
        Room Information
    </div>
    <div class="panel-content">
        <div class="info-row">
            <span class="label">Room Name</span>
            <span id="room-name" class="value">Select a room</span>
        </div>
        <div class="info-row">
            <span class="label">Room Type</span>
            <span id="room-type" class="pill">-</span>
        </div>
    </div>
</div>

<script type="module" src="/src/index.js"></script>

</body>
</html>
